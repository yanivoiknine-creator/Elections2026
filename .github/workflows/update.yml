name: עדכון סקרים ופרסום האתר

on:
  schedule:
    # כל 3 שעות (בשעון UTC). סקרי הערב בישראל מתפרסמים בערך ב-17:00-19:00 UTC.
    - cron: "10 */3 * * *"
  workflow_dispatch:        # מאפשר להריץ ידנית מלשונית Actions
  push:
    branches: [main]
    paths-ignore:
      - "data/polls.json"   # מונע לולאה: הריצה עצמה מעדכנת את הקובץ הזה
      - "README.md"

permissions:
  contents: write           # לשמירת data/polls.json בחזרה למאגר
  pages: write              # לפרסום ב-GitHub Pages
  id-token: write
  actions: read             # נדרש על ידי deploy-pages מגרסה v4 ואילך

concurrency:
  group: polls-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # כל הגרסאות כאן רצות על Node 24. Node 20 הוצא משימוש ב-GitHub
      # Actions, ולכן גרסאות ישנות יותר מייצרות אזהרת deprecation.
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: התקנת תלויות
        run: pip install -r requirements.txt

      - name: בדיקות הפרסר
        run: python test_parser.py

      - name: עדכון סקרים ובניית האתר
        run: python pipeline.py
        continue-on-error: true     # חסימה זמנית של אתר לא תפיל את הפרסום

      # דחיפה נדחית כשמשהו אחר נכנס ל-main בזמן שהריצה עבדה — למשל
      # העלאת קובץ דרך האתר של GitHub. במקרה כזה מושכים את השינוי,
      # מניחים את ה-commit שלנו מעליו ומנסים שוב.
      - name: שמירת הנתונים במאגר
        continue-on-error: true    # כשל בשמירה לא ימנע את פרסום האתר
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/polls.json
          if git diff --staged --quiet; then
            echo "אין שינוי בנתונים — אין מה לשמור."
            exit 0
          fi
          git commit -m "עדכון סקרים אוטומטי [skip ci]"
          for i in 1 2 3; do
            if git push; then
              echo "נשמר."
              exit 0
            fi
            echo "הדחיפה נדחתה (ניסיון $i) — מסנכרן מול main ומנסה שוב."
            git pull --rebase --autostash origin main || exit 1
            sleep 5
          done
          echo "לא הצלחתי לשמור אחרי 3 ניסיונות. הריצה הבאה תנסה שוב."
          exit 1

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
          # בלי זה, קבצים שמתחילים בנקודה מושמטים מהארכיון — ובכללם
          # docs/.nojekyll שנוצר על ידי build_static.py
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
